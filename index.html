  const winnerIds=middleCandidates.filter(i=>count%2||meanDistances[i]===closestMean);
  const baseDeltas=units.map((v,i)=>winnerIds.includes(i)?2:(v===sorted[0]||v===sorted[count-1]?-1:0));

  const key=Object.hasOwn(babyNameCounts,clean)?clean:clean.split(' ')[0];
  return {key,count:Object.hasOwn(babyNameCounts,key)?babyNameCounts[key]:null};
}
function chooseFinalWinner(tied,random=Math.random){
  const entries=tied.map(i=>({i,...namePopularity(players[i].name)}));
  const known=entries.filter(e=>e.count!==null);
  const top=known.length?Math.max(...known.map(e=>e.count)):null;
  const pool=known.length?known.filter(e=>e.count===top):entries;
  return {winner:pool[Math.min(pool.length-1,Math.floor(random()*pool.length))].i,entries,draw:pool.length>1,noData:!known.length};
}
function finalTieDetails(decision){
  const chosen=players[decision.winner];
  return `<div class="answer-card name-decider"><div class="eyebrow">THE MOST ORDINARY NAME WINS</div><h3>${escapeHTML(chosen.name)} takes the crown.</h3><p>Your parents did the hard work. You just turned up.</p><p>${decision.noData?'None of these spellings has a published count in the chosen list, so a random draw settled it.':decision.draw?'The leading names had equal published counts, so a random draw settled the remaining tie.':'The most popular name among the tied players wins. A positively unremarkable birth certificate.'}</p><details><summary>Show the name verdict</summary><ul>${decision.entries.map(e=>`<li>${escapeHTML(players[e.i].name)}: ${e.count===null?'no published match':fmt(e.count)+' babies named '+escapeHTML(e.key)}</li>`).join('')}</ul><p>ONS baby names, England and Wales, 2025. Published boy and girl counts are added for the same spelling. We use your entered first name; nicknames stay as entered. An unlisted name has no published match and ranks below a listed name. Equal leading counts, or no listed names, go to a random draw.</p><a href="https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/babynamesenglandandwalesbabynamesstatisticsboys" target="_blank" rel="noopener noreferrer">ONS boys’ names ↗</a> · <a href="https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/babynamesenglandandwalesbabynamesstatisticsgirls" target="_blank" rel="noopener noreferrer">ONS girls’ names ↗</a></details></div>`;
}
function final(){
  stage='final';setScreen('play');const best=Math.max(...players.map(p=>p.score)),tied=players.map((p,i)=>p.score===best?i:-1).filter(i=>i>=0),pending=tied.length>1&&!finalDecision;
  const winner=pending?null:players[finalDecision?finalDecision.winner:tied[0]];
  app.innerHTML=`<div class="eyebrow">Six rounds. Utterly ordinary.</div><div class="card center"><p>🏆</p><h1>${pending?'Equally ordinary.':'Average royalty.'}</h1><h2>${pending?tied.map(i=>escapeHTML(players[i].name)).join(' & '):escapeHTML(winner.name)}</h2><p class="muted">${best} point${best===1?'':'s'}. ${pending?'The scores are tied. Time to judge your parents’ naming choices.':'An outstanding commitment to being unremarkable.'}</p>${pending?'<p>The most popular baby name takes the crown. A deeply scientific decision.</p><button id="name-decider">Consult the birth register →</button>':finalDecision?finalTieDetails(finalDecision):''}${leaderboard()}<div class="row"><button id="again">Play again →</button><button id="new" class="secondary">Change players</button></div></div>`;
  if(pending)document.getElementById('name-decider').onclick=()=>{if(finalDecision)return;finalDecision=chooseFinalWinner(tied);final()};
  document.getElementById('again').onclick=()=>{finalDecision=null;players.forEach(p=>p.score=0);deck=buildDeck();round=0;beginRound()};document.getElementById('new').onclick=showPlayers;if(!pending)confetti();focusHeading();
}


// Original eight-bar pocket-funk loop: syncopated bass, soft keys, hook and light drums.
let musicEnabled=false,musicTimer=null,musicBus=null,musicStep=0,nextMusicTime=0;
const noiseCache=new WeakMap();
const grooveRoots=[33,33,29,29,36,36,31,31];
const grooveChords=[[60,64,67,71],[60,64,67,71],[57,60,64,67],[57,60,64,67],[59,62,64,67],[59,62,64,67],[59,62,65,69],[59,62,65,69]];
const bassHook=[0,null,0,12,null,null,7,null,0,null,12,10,null,7,null,12];
const leadHook=[76,null,null,79,null,null,81,null,null,79,null,76,null,null,74,null,72,null,null,76,null,null,79,null,null,76,null,74,72,null,null,null];
function musicVoice(midi,time,duration,volume,kind='sine'){
  const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type=kind;o.frequency.value=440*Math.pow(2,(midi-69)/12);o.connect(gain);gain.connect(musicBus);
  gain.gain.setValueAtTime(.0001,time);gain.gain.linearRampToValueAtTime(volume,time+.006);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);o.start(time);o.stop(time+duration+.02);
}
function bassVoice(midi,time){
  const o=audioCtx.createOscillator(),sub=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  o.type='sawtooth';sub.type='sine';o.frequency.value=sub.frequency.value=440*Math.pow(2,(midi-69)/12);filter.type='lowpass';filter.Q.value=.8;
  filter.frequency.setValueAtTime(750,time);filter.frequency.exponentialRampToValueAtTime(160,time+.2);o.connect(filter);sub.connect(filter);filter.connect(gain);gain.connect(musicBus);
  gain.gain.setValueAtTime(.0001,time);gain.gain.linearRampToValueAtTime(.19,time+.009);gain.gain.exponentialRampToValueAtTime(.0001,time+.21);o.start(time);sub.start(time);o.stop(time+.24);sub.stop(time+.24);
}
function drumNoise(time,duration,volume,cutoff){
  let noise=noiseCache.get(audioCtx);if(!noise){noise=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*.3),audioCtx.sampleRate);const samples=noise.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;noiseCache.set(audioCtx,noise)}
  const source=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();source.buffer=noise;filter.type='highpass';filter.frequency.value=cutoff;source.connect(filter);filter.connect(gain);gain.connect(musicBus);gain.gain.setValueAtTime(volume,time);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);source.start(time);source.stop(time+duration+.01);
}
function kick(time){const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.frequency.setValueAtTime(135,time);o.frequency.exponentialRampToValueAtTime(43,time+.12);o.connect(gain);gain.connect(musicBus);gain.gain.setValueAtTime(.26,time);gain.gain.exponentialRampToValueAtTime(.0001,time+.19);o.start(time);o.stop(time+.21)}
function grooveTick(step,time){
  const s=step%128,bar=Math.floor(s/16),beat=s%16,root=grooveRoots[bar],offset=bassHook[beat];
  if(offset!==null)bassVoice(root+offset,time);
  if(beat===0||beat===8||beat===14&&bar%2===1)kick(time);
  if(beat===4||beat===12){drumNoise(time,.11,.09,1400);musicVoice(50,time,.08,.055,'triangle')}
  if(beat%2===0)drumNoise(time,.035,beat%4===0?.035:.052,6500);
  if(beat===7||beat===15)drumNoise(time,.024,.019,7500);
  if(beat===2||beat===10)grooveChords[bar].forEach(n=>{musicVoice(n,time,.23,.035,'triangle');musicVoice(n+12,time,.18,.012)});
  let note=leadHook[s%32];if(bar>=4&&s%32===14)note=79;if(note!==null){musicVoice(note,time,.19,.10,'sine');musicVoice(note+12,time+.012,.12,.012,'triangle')}
}
function scheduleMusic(){if(!musicEnabled||document.hidden||audioCtx.state!=='running')return;const sixteenth=60/110/4;if(nextMusicTime<audioCtx.currentTime-.2)nextMusicTime=audioCtx.currentTime+.04;let guard=0;while(nextMusicTime<audioCtx.currentTime+.18&&guard++<16){grooveTick(musicStep,nextMusicTime);nextMusicTime+=sixteenth*(musicStep%2===0?1.07:.93);musicStep++}}
function pauseMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;if(musicBus){try{musicBus.disconnect()}catch{}musicBus=null}}
async function startMusic(){try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();if(!musicEnabled||document.hidden)return;pauseMusic();musicBus=audioCtx.createGain();musicBus.gain.value=.24;musicBus.connect(audioCtx.destination);nextMusicTime=audioCtx.currentTime+.06;musicTimer=setInterval(scheduleMusic,50);scheduleMusic()}catch{musicEnabled=false;updateMusicButton()}}
function updateMusicButton(){const b=document.getElementById('music');b.textContent='♫ Music: '+(musicEnabled?'on':'off');b.setAttribute('aria-pressed',String(musicEnabled))}
document.getElementById('music').onclick=()=>{musicEnabled=!musicEnabled;updateMusicButton();if(musicEnabled)startMusic();else pauseMusic()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseMusic();else if(musicEnabled)startMusic()});

let roundQuestionHistory=[];
function gameInProgress(){return ['handoff','guess','reveal-ready','question-preview','revealing','reveal-complete','results','final'].includes(stage)}
function canChangeQuestion(){return !deck[round]?.fixed&&['handoff','guess','reveal-ready','question-preview'].includes(stage)}
function confirmGameAction(title,message,label,onConfirm){
  const dialog=document.getElementById('game-dialog');if(dialog.open)return;
  dialog.innerHTML=`<h2 id="dialog-title">${escapeHTML(title)}</h2><p id="dialog-message">${escapeHTML(message)}</p><div class="dialog-actions"><button class="secondary" type="button" data-cancel autofocus>Keep playing</button><button type="button" data-confirm>${escapeHTML(label)}</button></div>`;
  dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();
  dialog.querySelector('[data-confirm]').onclick=()=>{dialog.close();onConfirm()};dialog.showModal();
}
function requestExitGame(){
  if(!gameInProgress())return;
  confirmGameAction('Exit this game?','This game’s scores and guesses will be cleared. Your player names will stay saved.','Exit to home',()=>{clearTimers();revealRun++;players=[];answers=[];deck=[];deltas=[];round=0;turn=0;currentReveal=null;finalDecision=null;roundQuestionHistory=[];setup()});
}
function requestQuestionChange(){
  if(!canChangeQuestion())return;
  const draft=stage==='guess'&&document.getElementById('answer')?.value.trim();
  if(answers.length||draft){confirmGameAction('Try a different question?','Everyone will answer a new question in the same category, starting with the first player. This round’s guesses will be cleared; earlier scores stay.','Change question',changeQuestion)}
  else changeQuestion();
}
function changeQuestion(){
  if(!canChangeQuestion())return;
  const category=deck[round],current=category.q;
  if(!roundQuestionHistory.includes(current))roundQuestionHistory.push(current);
  let choices=category.questions.filter(q=>!roundQuestionHistory.includes(q));
  if(!choices.length){roundQuestionHistory=[current];choices=category.questions.filter(q=>q!==current)}
  if(!choices.length)return;
  category.q=choices[Math.floor(Math.random()*choices.length)];roundQuestionHistory.push(category.q);
  answers=[];turn=0;deltas=[];currentReveal=null;showChangedQuestion();
}
function showChangedQuestion(){
  stage='question-preview';setScreen('play');
  app.innerHTML=roundTop()+`<div class="card center"><div class="eyebrow">New question. Same questionable judgement.</div><h2>${escapeHTML(deck[round].q[0])}</h2><p class="muted">Answer in ${escapeHTML(deck[round].q[1])}. Everyone starts this round afresh.</p><button id="accept-question">Pass to ${escapeHTML(players[0].name)} →</button></div>`;
  document.getElementById('accept-question').onclick=handoff;focusHeading();window.scrollTo(0,0);
}
document.addEventListener('click',event=>{const control=event.target.closest?.('[data-game-action]');if(!control)return;if(control.dataset.gameAction==='exit')requestExitGame();else if(control.dataset.gameAction==='change-question')requestQuestionChange()});


setup();
