function countValue(node,value,run){if(matchMedia('(prefers-reduced-motion: reduce)').matches){node.textContent=fmt(value);return}const start=performance.now();function tick(now){if(run!==revealRun||stage!=='revealing')return;const t=Math.min(1,(now-start)/1050);node.textContent=fmt(Math.round(value*(1-Math.pow(1-t,3))*100)/100);if(t<1)requestAnimationFrame(tick);else node.textContent=fmt(value)}requestAnimationFrame(tick)}
const crownMarkup='<svg viewBox="0 0 60 40" aria-hidden="true"><path d="M5 8 18 20 30 3 42 20 55 8 50 35H10Z" fill="#d4ff63" stroke="#efffbb" stroke-width="2.5" stroke-linejoin="round"/></svg>';
function averageText(result){return (result.rounded?'≈ ':'')+fmt(result.average)}
function revealBar(i,run){
  const el=document.getElementById('bar-'+i);if(!el)return;
  const award=deltas[i],base=currentReveal.baseDeltas[i];el.classList.add('revealed',base===2?'win':base<0?'out':'neutral');if(currentReveal.bonuses[i]&&base!==2)el.classList.add('bonus-only');
  if(currentReveal.bonuses[i])el.classList.add('bonus');
  el.setAttribute('aria-label',players[i].name+': '+fmt(answers[i])+', '+(award>0?'+':'')+award+' points');
  document.getElementById('bar-score-'+i).classList.add(award>0?'positive':award<0?'negative':'neutral');
  document.getElementById('bar-score-'+i).textContent=base===2?(currentReveal.bonuses[i]?'MIDDLE +2 · BONUS +1':'MIDDLE +2'):currentReveal.bonuses[i]?'AVERAGE BONUS +1':base===-1?'EXTREME −1':'NO POINTS';
  if(stage==='revealing'){countValue(document.getElementById('value-'+i),answers[i],run);beep(award>0)}
}
function reveal(){
  if(stage!=='reveal-ready')return;
  stage='revealing';const run=++revealRun,result=scoreGuesses(answers);deltas=result.deltas;currentReveal=result;
  players.forEach((p,i)=>p.score+=deltas[i]);
  const max=Math.max(...answers),scaleMax=max||1;
  const sorted=players.map((p,i)=>i).sort((a,b)=>answers[a]-answers[b]||a-b);
  const noPoints=sorted.filter(i=>result.baseDeltas[i]===0&&!result.bonuses[i]),extremes=sorted.filter(i=>result.baseDeltas[i]<0),bonusOnly=sorted.filter(i=>result.baseDeltas[i]===0&&result.bonuses[i]),winners=sorted.filter(i=>result.baseDeltas[i]===2);
  app.innerHTML=roundTop()+`<div class="card reveal-card"><div class="reveal-meta"><span class="eyebrow">The rise of the unremarkable</span><button id="skip" class="skip-reveal">Show results</button></div><h2>${escapeHTML(deck[round].q[0])}</h2><div class="phase-label" id="phase">Act 1 · Out of the points</div><p class="reveal-status" id="commentary" role="status">${noPoints.length?quip('intro'):'No passengers this round. Everyone has a part to play.'}</p><p class="chart-unit muted">Guesses in ${escapeHTML(deck[round].q[1])} · bars rise from zero</p><div class="chart-scroll" tabindex="0" aria-label="Player guesses chart. Scroll horizontally for more players."><div class="bar-plot" style="--players:${players.length}"><div class="chart-bars"><div class="chart-grid" aria-hidden="true"><span class="scale-max">${fmt(max)}</span><span class="scale-zero">0</span></div><div id="average-line" class="average-line" style="bottom:${result.average/scaleMax*78}%"><span>AVG BONUS ${escapeHTML(averageText(result))}</span></div><div id="middle-line" class="middle-line" style="bottom:${result.middle/scaleMax*78}%"><span>MIDDLE ${fmt(result.middle)}</span></div><div class="bar-columns">${sorted.map(i=>`<div class="bar-column" id="bar-${i}" style="--height:${answers[i]/scaleMax*78}%" aria-label="${escapeHTML(players[i].name)}: guess locked"><div class="bar-fill"></div><div class="bar-number" id="value-${i}">?</div><div class="bar-crown">${crownMarkup}</div></div>`).join('')}</div></div><div class="bar-labels">${sorted.map(i=>`<div><span class="bar-name">${escapeHTML(players[i].name)}</span><span class="bar-score" id="bar-score-${i}">LOCKED</span></div>`).join('')}</div></div></div><p class="chart-hint" id="chart-hint">Swipe the chart to see everyone →</p><div class="target-readouts" id="target-readouts" hidden><div class="middle-readout">Middle target <strong>${fmt(result.middle)}</strong><span>Middle guess(es) earn +2</span></div><div class="average-readout" id="average-readout">Average bonus <strong>${escapeHTML(averageText(result))}</strong><span>Hit the exact average for +1 extra</span></div></div><div id="results" hidden></div><button id="next" hidden>${round===4?'Final results →':'Next round →'}</button></div>`;
  focusHeading();const scroll=document.querySelector('.chart-scroll');document.getElementById('chart-hint').hidden=scroll.scrollWidth<=scroll.clientWidth;
  document.getElementById('skip').onclick=()=>{clearTimers();finishReveal(result)};
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let time=reduced?0:200;
  function queueBars(ids){ids.forEach(i=>{later(()=>{if(stage==='revealing')revealBar(i,run)},time);time+=reduced?0:420});time+=reduced?0:(ids.length?1200:450)}
  queueBars(noPoints);
  later(()=>{if(stage!=='revealing')return;document.getElementById('phase').textContent='Act 2 · Highest & lowest';document.getElementById('commentary').textContent=extremes.length?quip('extremes'):'A winner at the extreme keeps their points. Average has its privileges.'},time);
  queueBars(extremes);
  later(()=>{if(stage!=='revealing')return;document.getElementById('phase').textContent='Act 3 · The middle wins';document.getElementById('commentary').textContent='And now… the least remarkable of you all.';document.getElementById('average-line').classList.add('visible');document.getElementById('middle-line').classList.add('visible');document.getElementById('target-readouts').hidden=false},time);
  time+=reduced?0:650;queueBars(bonusOnly);queueBars(winners);
  later(()=>finishReveal(result),time+(reduced?0:150));
}
function answerCard(){
  const q=deck[round].q;
  if(!q[2])return '<div class="answer-card wild-answer"><div class="eyebrow">Wild Cards</div><h3>No factual answer. Just questionable judgement.</h3><p>This one is hypothetical. The middle guess wins +2; an exact average guess gets +1 extra.</p></div>';
  const fact=q[2];return `<div class="answer-card"><div class="eyebrow">And the real answer is…</div><h3>${escapeHTML(fact.answer)}</h3><p>${escapeHTML(fact.note)}</p>${fact.url?`<a href="${escapeHTML(fact.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(fact.source)} ↗</a>`:`<small>${escapeHTML(fact.source)}</small>`}<p class="answer-note">A little knowledge to take home. Points reward the middle guess, with an extra bonus for hitting the average.</p></div>`;
}
function finishReveal(result){
  if(stage!=='revealing')return;stage='results';document.getElementById('skip').hidden=true;
  document.getElementById('phase').textContent='Act 3 · The middle wins';document.getElementById('average-line').classList.add('visible');document.getElementById('middle-line').classList.add('visible');document.getElementById('target-readouts').hidden=false;
  players.forEach((p,i)=>{revealBar(i,revealRun);document.getElementById('value-'+i).textContent=fmt(answers[i])});
  document.getElementById('commentary').textContent=quip(result.bonuses.some(Boolean)?'bonus':'middle');
  const results=document.getElementById('results');results.hidden=false;results.className='fade-in';
  const middleNames=players.filter((_,i)=>result.baseDeltas[i]===2).map(p=>escapeHTML(p.name)).join(', '),bonusNames=players.filter((_,i)=>result.bonuses[i]).map(p=>escapeHTML(p.name)).join(', ');
  const sortedAnswers=[...answers].sort((a,b)=>a-b),n=answers.length,central=n%2?fmt(sortedAnswers[(n-1)/2]):fmt(sortedAnswers[n/2-1])+' and '+fmt(sortedAnswers[n/2]);
  results.innerHTML=`<p class="score-note"><strong>Middle +2:</strong> ${middleNames}.<br><strong>Exact average +1:</strong> ${bonusNames||'Nobody this round'}.${result.baseDeltas.some((v,i)=>v===2&&result.bonuses[i])?'<br>Middle + average bonus = <strong>+3 total</strong>.':''}</p><details class="average-maths"><summary>How the middle and average were calculated</summary><p>Sorted guesses: ${sortedAnswers.map(fmt).join(', ')}.<br>Central guess${n%2?'':'es'}: ${central}. ${n%2?'':'Both central guess values earn +2.'}</p><p>Average: (${answers.map(fmt).join(' + ')}) ÷ ${n} = ${escapeHTML(averageText(result))}</p><p class="muted">${result.rounded?'The displayed average is rounded to 3 decimal places. The bonus uses the full value.':'The bonus uses the unrounded average.'} A middle winner also hitting the average gets +3.</p></details>${answerCard()}${leaderboard(true)}`;
  const next=document.getElementById('next');next.hidden=false;next.onclick=()=>{clearTimers();if(round===4)final();else{round++;beginRound()}};
  beep(true);confetti();
}

function leaderboard(showRound=false){return `<table><caption class="eyebrow">${showRound?'Live leaderboard':'Final standings'}</caption><thead><tr><th scope="col">Player</th>${showRound?'<th scope="col">Round</th>':''}<th scope="col">Total</th></tr></thead><tbody>${players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.i-b.i).map(p=>`<tr><th scope="row">${escapeHTML(p.name)}</th>${showRound?`<td class="${deltas[p.i]>0?'positive':deltas[p.i]<0?'negative':''}">${deltas[p.i]>0?'+':''}${deltas[p.i]}</td>`:''}<td>${p.score}</td></tr>`).join('')}</tbody></table>`}
function final(){stage='final';const best=Math.max(...players.map(p=>p.score)),winners=players.filter(p=>p.score===best);app.innerHTML=`<div class="eyebrow">Five rounds. Utterly ordinary.</div><div class="card center"><p>🏆</p><h1>${winners.length>1?'Shared champions!':'Average royalty.'}</h1><h2>${winners.map(p=>escapeHTML(p.name)).join(' & ')}</h2><p class="muted">${best} point${best===1?'':'s'}. An outstanding commitment to being unremarkable.</p>${leaderboard()}<div class="row"><button id="again">Play again →</button><button id="new" class="secondary">Change players</button></div></div>`;document.getElementById('again').onclick=()=>{players.forEach(p=>p.score=0);deck=categories.map(c=>({...c,q:c.questions[Math.floor(Math.random()*c.questions.length)]}));round=0;beginRound()};document.getElementById('new').onclick=setup;confetti();focusHeading()}

// Original eight-bar pocket-funk loop: syncopated bass, soft keys, hook and light drums.
let musicEnabled=false,musicTimer=null,musicBus=null,musicStep=0,nextMusicTime=0;
const noiseCache=new WeakMap();
const grooveRoots=[33,33,29,29,36,36,31,31];
const grooveChords=[[60,64,67,71],[60,64,67,71],[57,60,64,67],[57,60,64,67],[59,62,64,67],[59,62,64,67],[59,62,65,69],[59,62,65,69]];
const bassHook=[0,null,0,12,null,null,7,null,0,null,12,10,null,7,null,12];
const leadHook=[76,null,null,79,null,null,81,null,null,79,null,76,null,null,74,null,72,null,null,76,null,null,79,null,null,76,null,74,72,null,null,null];
function musicVoice(midi,time,duration,volume,kind='sine'){
  const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type=kind;o.frequency.value=440*Math.pow(2,(midi-69)/12);o.connect(gain);gain.connect(musicBus);
  gain.gain.setValueAtTime(.0001,time);gain.gain.linearRampToValueAtTime(volume,time+.006);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);o.start(time);o.stop(time+duration+.02);
}
function bassVoice(midi,time){
  const o=audioCtx.createOscillator(),sub=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
  o.type='sawtooth';sub.type='sine';o.frequency.value=sub.frequency.value=440*Math.pow(2,(midi-69)/12);filter.type='lowpass';filter.Q.value=.8;
  filter.frequency.setValueAtTime(750,time);filter.frequency.exponentialRampToValueAtTime(160,time+.2);o.connect(filter);sub.connect(filter);filter.connect(gain);gain.connect(musicBus);
  gain.gain.setValueAtTime(.0001,time);gain.gain.linearRampToValueAtTime(.19,time+.009);gain.gain.exponentialRampToValueAtTime(.0001,time+.21);o.start(time);sub.start(time);o.stop(time+.24);sub.stop(time+.24);
}
function drumNoise(time,duration,volume,cutoff){
  let noise=noiseCache.get(audioCtx);if(!noise){noise=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*.3),audioCtx.sampleRate);const samples=noise.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1;noiseCache.set(audioCtx,noise)}
  const source=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();source.buffer=noise;filter.type='highpass';filter.frequency.value=cutoff;source.connect(filter);filter.connect(gain);gain.connect(musicBus);gain.gain.setValueAtTime(volume,time);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);source.start(time);source.stop(time+duration+.01);
}
function kick(time){const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.frequency.setValueAtTime(135,time);o.frequency.exponentialRampToValueAtTime(43,time+.12);o.connect(gain);gain.connect(musicBus);gain.gain.setValueAtTime(.26,time);gain.gain.exponentialRampToValueAtTime(.0001,time+.19);o.start(time);o.stop(time+.21)}
function grooveTick(step,time){
  const s=step%128,bar=Math.floor(s/16),beat=s%16,root=grooveRoots[bar],offset=bassHook[beat];
  if(offset!==null)bassVoice(root+offset,time);
  if(beat===0||beat===8||beat===14&&bar%2===1)kick(time);
  if(beat===4||beat===12){drumNoise(time,.11,.09,1400);musicVoice(50,time,.08,.055,'triangle')}
  if(beat%2===0)drumNoise(time,.035,beat%4===0?.035:.052,6500);
  if(beat===7||beat===15)drumNoise(time,.024,.019,7500);
  if(beat===2||beat===10)grooveChords[bar].forEach(n=>{musicVoice(n,time,.23,.035,'triangle');musicVoice(n+12,time,.18,.012)});
  let note=leadHook[s%32];if(bar>=4&&s%32===14)note=79;if(note!==null){musicVoice(note,time,.19,.10,'sine');musicVoice(note+12,time+.012,.12,.012,'triangle')}
}
function scheduleMusic(){if(!musicEnabled||document.hidden||audioCtx.state!=='running')return;const sixteenth=60/110/4;if(nextMusicTime<audioCtx.currentTime-.2)nextMusicTime=audioCtx.currentTime+.04;let guard=0;while(nextMusicTime<audioCtx.currentTime+.18&&guard++<16){grooveTick(musicStep,nextMusicTime);nextMusicTime+=sixteenth*(musicStep%2===0?1.07:.93);musicStep++}}
function pauseMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null;if(musicBus){try{musicBus.disconnect()}catch{}musicBus=null}}
async function startMusic(){try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();if(!musicEnabled||document.hidden)return;pauseMusic();musicBus=audioCtx.createGain();musicBus.gain.value=.24;musicBus.connect(audioCtx.destination);nextMusicTime=audioCtx.currentTime+.06;musicTimer=setInterval(scheduleMusic,50);scheduleMusic()}catch{musicEnabled=false;updateMusicButton()}}
function updateMusicButton(){const b=document.getElementById('music');b.textContent='♫ Music: '+(musicEnabled?'on':'off');b.setAttribute('aria-pressed',String(musicEnabled))}
document.getElementById('music').onclick=()=>{musicEnabled=!musicEnabled;updateMusicButton();if(musicEnabled)startMusic();else pauseMusic()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseMusic();else if(musicEnabled)startMusic()});

setup();
</script></body></html>
