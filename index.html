<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171b33"><title>UNREMARKABLE! — Average wins</title>
<style>
:root{color-scheme:dark;--bg:#111427;--card:#1c2140;--ink:#f8f7f2;--muted:#b8bfd9;--lime:#d4ff63;--red:#ff7e94}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2d315a,var(--bg) 70%);color:var(--ink);font:17px/1.5 system-ui,sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:24px 20px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:35px}.brand{font-weight:950;letter-spacing:-1px;font-size:clamp(20px,4vw,30px)}.brand span{color:var(--lime)}h1{font-size:clamp(38px,7vw,66px);line-height:1.05;letter-spacing:-2px;margin:12px 0 24px}h2{font-size:clamp(24px,4vw,35px);line-height:1.2;margin:12px 0 20px}p{margin:12px 0}.muted,small{color:var(--muted)}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.card{background:var(--card);border:1px solid #353c65;border-radius:24px;padding:clamp(20px,4vw,36px);margin:20px 0;box-shadow:0 16px 60px #0002}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px 20px;cursor:pointer;font-weight:750;background:var(--lime);color:#151a29;min-height:48px}button.secondary{background:#30385b;color:var(--ink)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:4px}input,textarea{width:100%;background:#10152d;border:1px solid #535d86;border-radius:12px;padding:14px;color:var(--ink);margin:8px 0 14px}textarea{resize:vertical;min-height:160px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.chip{border:1px solid #515b81;border-radius:99px;padding:6px 12px;font-size:13px}.error{color:#ffb3be;min-height:26px}.progress{height:5px;background:#343b60;border-radius:5px;margin:16px 0 24px;overflow:hidden}.progress div{height:100%;background:var(--lime)}details{margin:22px 0}summary{cursor:pointer;font-weight:700}li{margin:10px 0}.center{text-align:center}.pill{background:#30385b;border-radius:12px;padding:12px 18px;display:inline-block}.line{position:relative;margin:45px 18px 12px;height:300px;border-top:3px solid #687197}.endpoint{position:absolute;top:-30px;color:var(--muted);font-size:12px}.endpoint.right{right:0}.marker{position:absolute;left:50%;top:var(--lane);width:150px;max-width:44vw;transform:translateX(-50%);transition:left 1.4s cubic-bezier(.2,.8,.2,1),opacity .7s;opacity:0;text-align:center;font-size:13px}.marker:before{content:'';position:absolute;width:2px;background:#626c96;bottom:100%;height:var(--stem);left:50%}.marker b{display:block;position:relative;z-index:1;border:1px solid #64709d;background:#293154;border-radius:12px;padding:8px;overflow-wrap:anywhere}.marker.win b{background:#d4ff63;color:#151a29;border-color:#d4ff63;box-shadow:0 0 22px #d4ff6344}.marker.out b{background:#6f2944;border-color:var(--red)}.median{position:absolute;top:-14px;bottom:0;border-left:2px dashed var(--lime);opacity:0;transition:opacity .6s}.median span{position:absolute;top:-36px;left:0;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--lime)}table{width:100%;border-collapse:collapse;margin:14px 0}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #394165;overflow-wrap:anywhere}td:last-child,th:last-child{text-align:right}.positive{color:var(--lime)}.negative{color:#ff9bb0}.party{position:fixed;top:-20px;width:9px;height:15px;pointer-events:none;animation:fall 2.5s ease-in forwards;z-index:5}@keyframes fall{to{transform:translateY(105vh) rotate(650deg);opacity:0}}footer{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}@media(max-width:500px){main{padding:18px 14px 35px}.card{border-radius:18px}.line{margin-left:28px;margin-right:28px}.marker{font-size:11px;width:110px}td,th{padding:10px 4px;font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head>
<body><main><header><div class="brand">UNREMARKABLE<span>!</span></div><button id="sound" class="secondary" aria-pressed="false">Sound: off</button></header><section id="app" aria-label="Game"></section><footer>One device. Secret guesses. Spectacularly average.</footer></main>
<script>
'use strict';
const categories=[
{name:'Everyday life',icon:'☕',questions:[['How many minutes is the ideal lunch break?','minutes'],['How many unread emails feels like too many?','emails'],['How many cups of tea or coffee make a good week?','cups'],['How many minutes should a perfect shower last?','minutes'],['How many alarms would you set for an early flight?','alarms'],['How many pairs of shoes is enough?','pairs'],['How many minutes early should you arrive at a party?','minutes'],['How many houseplants would make a home feel leafy?','plants'],['How many minutes is too long to wait for a bus?','minutes'],['How many hours makes an ideal night of sleep?','hours']]},
{name:'Food & drink',icon:'🍕',questions:[['How many slices of pizza make the perfect dinner?','slices'],['How many chips would you steal from a friend’s plate?','chips'],['How many biscuits belong beside a cup of tea?','biscuits'],['How many pounds would you pay for an amazing sandwich?','£'],['How many scoops make the ideal ice cream?','scoops'],['How many different snacks should a movie night have?','snacks'],['How many minutes would you queue for great food?','minutes'],['How many toppings belong on a pizza?','toppings'],['How many pancakes make a great breakfast?','pancakes'],['How many people should share one large cake?','people']]},
{name:'Entertainment',icon:'🎬',questions:[['How many minutes should the perfect film last?','minutes'],['How many episodes is a satisfying TV binge?','episodes'],['How many songs should a concert include?','songs'],['How many pounds is a fair cinema ticket price?','£'],['How many hours would you play a brilliant game in one sitting?','hours'],['How many books would you like to read in a year?','books'],['How many minutes of adverts is too many?','minutes'],['How many people makes a perfect board-game night?','people'],['How many films should a great series have?','films'],['How many minutes should a podcast episode last?','minutes']]},
{name:'Travel & adventure',icon:'🧭',questions:[['How many days makes the perfect holiday?','days'],['How many minutes would you walk for a spectacular view?','minutes'],['How many countries would you like to visit in your lifetime?','countries'],['How many outfits would you pack for a week away?','outfits'],['How many hours is the longest enjoyable road trip?','hours'],['How many photos would you take on a weekend away?','photos'],['How many people makes an ideal travel group?','people'],['How many days could you happily camp?','days'],['How many minutes early would you arrive for a train?','minutes'],['How many hours should a perfect beach day last?','hours']]},
{name:'Wild hypotheticals',icon:'🚀',questions:[['How many tiny dragons would you adopt?','dragons'],['How many years would you travel into the future?','years'],['How many robots should help run your home?','robots'],['How many days would you spend on the Moon?','days'],['How many extra hours would you add to each day?','hours'],['How many secret rooms should your dream house have?','rooms'],['How many superpowers would be enough?','superpowers'],['How many dinosaurs should a very small dinosaur park have?','dinosaurs'],['How many weeks would you live in an underwater city?','weeks'],['How many wishes should a generous genie grant?','wishes']]}
];
const app=document.getElementById('app');let players=[],round=0,turn=0,answers=[],deck=[],deltas=[],stage='setup',timers=[],sound=false,audioCtx;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-GB',{maximumFractionDigits:2}).format(n);
function later(fn,ms){timers.push(setTimeout(fn,ms))}function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function beep(win=false){if(!sound)return;try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(win?660:280,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(win?990:420,audioCtx.currentTime+.18);g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.3);o.start();o.stop(audioCtx.currentTime+.3)}catch{}}
document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent='Sound: '+(sound?'on':'off');document.getElementById('sound').setAttribute('aria-pressed',String(sound));beep()};
function focusHeading(){const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus()}}
function rules(){return `<details><summary>How to be unremarkable</summary><ol><li>Enter 3–12 different player names. Play five rounds, one question from each category.</li><li>Pass the device. Each player secretly enters a number. There are no factual right answers: predict the middle of your group.</li><li>The median is the middle guess; with an even number of players it is the average of the two central guesses.</li><li>The guess or guesses closest to the median earn <strong>+1 each</strong>. All tied guesses share the same result. The lowest and highest guesses lose <strong>−1 each</strong>. Everyone else scores 0.</li><li>A middle winner always gets +1, even if their guess also ties an extreme. If everyone answers the same, everyone earns +1.</li><li>Highest total after five rounds wins. A tied total means shared champions.</li></ol></details>`}
function setup(){clearTimers();stage='setup';let names='';try{names=JSON.parse(localStorage.getItem('unremarkable-names')||'[]').join('\n')}catch{}app.innerHTML=`<div class="eyebrow">The party game where average wins</div><h1>Greatness is<br>overrated.</h1><p class="muted">Aim for the middle. Avoid the extremes. Make being ordinary an extraordinary achievement.</p><div class="chips">${categories.map(c=>`<span class="chip">${c.icon} ${c.name}</span>`).join('')}</div><div class="card"><h2>Who’s playing?</h2><form id="setup"><label for="names">Player names <span class="muted">· one per line · 3–12 players</span></label><textarea id="names" maxlength="400" placeholder="Alex&#10;Sam&#10;Taylor" autocomplete="off">${escapeHTML(names)}</textarea><div id="error" class="error" role="alert"></div><button>Let’s be average →</button></form>${rules()}</div>`;document.getElementById('setup').onsubmit=e=>{e.preventDefault();const list=document.getElementById('names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let error='';if(list.length<3||list.length>12)error='Please enter between 3 and 12 players.';else if(list.some(s=>s.length>24))error='Keep each name to 24 characters or fewer.';else if(new Set(list.map(s=>s.toLowerCase())).size!==list.length)error='Use a different name for each player.';if(error){document.getElementById('error').textContent=error;return}players=list.map(name=>({name,score:0}));try{localStorage.setItem('unremarkable-names',JSON.stringify(list))}catch{}deck=categories.map(c=>({...c,q:c.questions[Math.floor(Math.random()*c.questions.length)]}));round=0;beginRound()}}
function roundTop(){return `<div class="eyebrow">Round ${round+1} / 5 · ${deck[round].icon} ${deck[round].name}</div><div class="progress"><div style="width:${round/5*100}%"></div></div>`}
function beginRound(){answers=[];turn=0;handoff()}
function handoff(){stage='handoff';app.innerHTML=roundTop()+`<div class="card center"><p class="muted">Player ${turn+1} of ${players.length}</p><h2>Pass to ${escapeHTML(players[turn].name)}</h2><p class="muted">Keep the next screen to yourself.</p><button id="ready">I’m ${escapeHTML(players[turn].name)} — ready</button></div>`;document.getElementById('ready').onclick=guess;focusHeading()}
function guess(){stage='guess';app.innerHTML=roundTop()+`<div class="card"><p class="muted">${escapeHTML(players[turn].name)}, find the middle.</p><h2>${escapeHTML(deck[round].q[0])}</h2><form id="guess"><label for="answer">Your secret number · ${deck[round].q[1]}</label><input id="answer" type="number" inputmode="decimal" min="0" max="1000000000" step="0.01" required autocomplete="off" placeholder="Enter your guess"><small>0 to 1,000,000,000 · up to 2 decimal places</small><div class="error" id="error" role="alert"></div><button>Lock in & hide →</button></form></div>`;document.getElementById('guess').onsubmit=e=>{e.preventDefault();if(stage!=='guess')return;const raw=document.getElementById('answer').value;const n=Number(raw);if(!raw.trim()||!Number.isFinite(n)||n<0||n>1e9||Math.abs(n*100-Math.round(n*100))>.0001){document.getElementById('error').textContent='Enter a number in range, with up to 2 decimal places.';return}answers.push(n);beep();turn++;if(turn<players.length)handoff();else revealReady()};focusHeading()}
function revealReady(){stage='reveal-ready';app.innerHTML=roundTop()+`<div class="card center"><div class="eyebrow">All guesses locked</div><h2>Gather round.<br>It’s time to be average.</h2><p class="muted">${escapeHTML(deck[round].q[0])}</p><button id="reveal">Reveal the number line →</button></div>`;document.getElementById('reveal').onclick=reveal;focusHeading()}
function scoreGuesses(values){const sorted=[...values].sort((a,b)=>a-b),n=sorted.length,median=n%2?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;const distances=values.map(v=>Math.abs(v-median)),best=Math.min(...distances),epsilon=1e-7;return {median,deltas:values.map((v,i)=>Math.abs(distances[i]-best)<epsilon?1:(v===sorted[0]||v===sorted[n-1]?-1:0))}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<35;i++){const el=document.createElement('i');el.className='party';el.style.left=Math.random()*100+'vw';el.style.background=['#d4ff63','#ff7e94','#a69aff'][i%3];el.style.animationDelay=Math.random()*.5+'s';document.body.append(el);later(()=>el.remove(),3200)}}
function reveal(){if(stage!=='reveal-ready')return;stage='revealing';const result=scoreGuesses(answers);deltas=result.deltas;players.forEach((p,i)=>p.score+=deltas[i]);const min=Math.min(...answers),max=Math.max(...answers),spread=max-min;const position=v=>spread?8+(v-min)/spread*84:50;const groups=[...new Set(answers)].sort((a,b)=>a-b).map(v=>({v,ids:answers.map((x,i)=>x===v?i:-1).filter(i=>i>=0)}));let lineHeight=20;groups.forEach(g=>{g.lane=lineHeight;lineHeight+=Math.max(76,36+g.ids.reduce((sum,id)=>sum+Math.ceil(players[id].name.length/12),0)*22)});app.innerHTML=roundTop()+`<div class="card"><h2>${escapeHTML(deck[round].q[0])}</h2><p id="commentary" role="status">The guesses are taking their places…</p><div class="line" style="height:${Math.max(220,lineHeight+30)}px"><span class="endpoint">${fmt(min)}</span><span class="endpoint right">${fmt(max)}</span><div class="median" style="left:${position(result.median)}%"><span>Median: ${fmt(result.median)}</span></div>${groups.map((g,i)=>`<div class="marker" id="marker-${i}" style="--lane:${g.lane}px;--stem:${g.lane+3}px"><b>${fmt(g.v)}<br>${g.ids.map(id=>escapeHTML(players[id].name)).join(' & ')}</b></div>`).join('')}</div><div id="results" hidden></div><button id="next" hidden>${round===4?'Final results →':'Next round →'}</button></div>`;focusHeading();groups.forEach((g,i)=>later(()=>{const el=document.getElementById('marker-'+i);el.style.left=position(g.v)+'%';el.style.opacity=1;beep()},100+i*400));later(()=>finishReveal(result,groups),groups.length*400+1600)}
function finishReveal(result,groups){if(stage!=='revealing')return;stage='results';document.querySelector('.median').style.opacity=1;groups.forEach((g,i)=>document.getElementById('marker-'+i).classList.add(deltas[g.ids[0]]===1?'win':deltas[g.ids[0]]===-1?'out':'neutral'));const winners=players.filter((_,i)=>deltas[i]===1).map(p=>p.name).join(', ');document.getElementById('commentary').textContent=winners+' — perfectly unremarkable! +1 each.';const el=document.getElementById('results');el.hidden=false;el.innerHTML=`<p class="muted">Green: middle winners +1 · Red: extremes −1 · Others: 0</p>${leaderboard(true)}`;const next=document.getElementById('next');next.hidden=false;next.onclick=()=>{clearTimers();if(round===4)final();else{round++;beginRound()}};beep(true);confetti()}
function leaderboard(showRound=false){return `<table><caption class="eyebrow">${showRound?'Live leaderboard':'Final standings'}</caption><thead><tr><th scope="col">Player</th>${showRound?'<th scope="col">Round</th>':''}<th scope="col">Total</th></tr></thead><tbody>${players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.i-b.i).map(p=>`<tr><th scope="row">${escapeHTML(p.name)}</th>${showRound?`<td class="${deltas[p.i]>0?'positive':deltas[p.i]<0?'negative':''}">${deltas[p.i]>0?'+':''}${deltas[p.i]}</td>`:''}<td>${p.score}</td></tr>`).join('')}</tbody></table>`}
function final(){stage='final';const best=Math.max(...players.map(p=>p.score)),winners=players.filter(p=>p.score===best);app.innerHTML=`<div class="eyebrow">Five rounds. Utterly ordinary.</div><div class="card center"><p>🏆</p><h1>${winners.length>1?'Shared champions!':'Average royalty.'}</h1><h2>${winners.map(p=>escapeHTML(p.name)).join(' & ')}</h2><p class="muted">${best} point${best===1?'':'s'}. An outstanding commitment to being unremarkable.</p>${leaderboard()}<div class="row"><button id="again">Play again →</button><button id="new" class="secondary">Change players</button></div></div>`;document.getElementById('again').onclick=()=>{players.forEach(p=>p.score=0);deck=categories.map(c=>({...c,q:c.questions[Math.floor(Math.random()*c.questions.length)]}));round=0;beginRound()};document.getElementById('new').onclick=setup;confetti();focusHeading()}
setup();
</script></body></html>
